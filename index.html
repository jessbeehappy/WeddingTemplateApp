            dark: { bg: 'bg-stone-950', text: 'text-stone-300', title: 'text-white', btn: 'bg-stone-800 hover:bg-stone-700 text-white', iconBg: 'bg-stone-900', iconColor: 'text-stone-600 fill-stone-800', signoff: 'text-stone-500', border: 'border-stone-800', checkBg: 'bg-stone-900/50', checkBorder: 'border-stone-700 group-hover:border-stone-500', checkFill: 'bg-white border-white text-black', checkedText: 'opacity-30 line-through decoration-stone-600', progressBg: 'bg-stone-900', progressFill: 'bg-stone-300' }
        };

        // --- CUSTOM KEYPAD SCREEN ---
        const PinScreen = ({ onAccess }) => {
            const [pin, setPin] = useState('');
            const [error, setError] = useState(false);
            const [isUnlocking, setIsUnlocking] = useState(false);

            const handleKeyPress = (num) => {
                if (pin.length < 4) setPin(prev => prev + num);
            };
            const handleClear = () => setPin('');
            const handleEnter = () => {
                if (pin === CONFIG.pinCode) {
                    localStorage.setItem('weddingAuth_' + CONFIG.pinCode, 'true');
                    setIsUnlocking(true);
                    setTimeout(() => onAccess(), 600);
                } else {
                    setError(true);
                    setTimeout(() => { setPin(''); setError(false); }, 400);
                }
            };

            return (
                <div className={`min-h-screen flex flex-col items-center justify-center px-4 bg-stone-50 transition-all duration-700 ease-in-out ${isUnlocking ? 'opacity-0 scale-110 blur-sm pointer-events-none' : 'opacity-100 scale-100'}`}>
                    <div className="text-center mb-8 animate-in fade-in slide-in-from-bottom-4 duration-700">
                        <Icons.Lock className="w-8 h-8 mx-auto mb-6 text-stone-300" />
                        <h1 className="text-4xl sm:text-5xl font-serif text-black mb-3">{CONFIG.coupleNames}</h1>
                        <p className="text-stone-500 font-light tracking-wide">{CONFIG.displayDate}</p>
                        <p className="text-stone-400 font-light text-sm mt-1">{CONFIG.weddingLocation}</p>
                    </div>
                    
                    <div className={`flex justify-center gap-4 mb-8 h-4 transition-transform duration-300 ${error ? 'animate-shake' : ''}`}>
                        {[0, 1, 2, 3].map(i => (
                            <div key={i} className={`w-4 h-4 rounded-full border-2 transition-all duration-200 ${pin.length > i ? 'bg-stone-800 border-stone-800 scale-110' : 'border-stone-300 bg-transparent'}`} />
                        ))}
                    </div>
                    {error && <p className="text-rose-500 text-sm font-medium absolute mt-[-20px] transition-opacity">Incorrect PIN</p>}

                    <div className="grid grid-cols-3 gap-4 sm:gap-6 max-w-[280px] w-full mx-auto mt-4 animate-in fade-in slide-in-from-bottom-8 duration-700 delay-150">
                        {[1, 2, 3, 4, 5, 6, 7, 8, 9].map(num => (
                            <button key={num} onClick={() => handleKeyPress(num)} className="aspect-square rounded-full bg-white shadow-sm text-2xl font-light text-stone-700 active:bg-stone-200 active:scale-95 transition-all hover:shadow-md flex items-center justify-center">{num}</button>
                        ))}
                        <button onClick={handleClear} className="aspect-square rounded-full text-stone-400 font-medium active:bg-stone-200 active:scale-95 transition-all flex items-center justify-center text-sm uppercase tracking-wider">Clear</button>
                        <button onClick={() => handleKeyPress(0)} className="aspect-square rounded-full bg-white shadow-sm text-2xl font-light text-stone-700 active:bg-stone-200 active:scale-95 transition-all hover:shadow-md flex items-center justify-center">0</button>
                        <button onClick={handleEnter} className="aspect-square rounded-full bg-black text-white shadow-md active:opacity-80 active:scale-95 transition-all flex items-center justify-center"><Icons.ArrowRight className="w-8 h-8" /></button>
                    </div>
                </div>
            );
        };

        // --- MODALS ---
        const HelpfulLinksModal = ({ onClose }) => (
            <div className="fixed inset-0 bg-black/60 z-[100] flex items-center justify-center p-4 animate-in fade-in">
                <div className="bg-white rounded-2xl w-full max-w-sm overflow-hidden shadow-2xl animate-in slide-in-from-bottom-8">
                    <div className="bg-stone-100 px-6 py-4 flex justify-between items-center border-b border-stone-200">
                        <h3 className="font-serif text-xl text-black">Helpful Links</h3>
                        <button onClick={onClose} className="p-1 rounded-full hover:bg-black/10 transition"><Icons.X className="w-5 h-5 text-stone-600" /></button>
                    </div>
                    <div className="p-6 space-y-3">
                        {CONFIG.helpfulLinks.map((link, i) => (
                            <a key={i} href={link.url} target="_blank" className="flex items-center gap-3 p-4 rounded-xl border border-stone-200 hover:bg-stone-50 transition-colors group">
                                <Icons.ExternalLink className="w-5 h-5 text-stone-400 group-hover:text-black transition-colors" />
                                <span className="font-medium text-stone-800">{link.title}</span>
                            </a>
                        ))}
                    </div>
                </div>
            </div>
        );

        const MessageModal = ({ data, onClose }) => {
            const theme = MODAL_THEMES[data.theme] || MODAL_THEMES.neutral;
            return (
                <div className={`fixed inset-0 ${theme.bg} z-[100] overflow-hidden animate-in fade-in duration-500 flex flex-col items-center justify-center p-8 text-center`}>
                    <button onClick={onClose} className={`absolute top-6 right-6 p-2 rounded-full transition-colors ${theme.btn}`}><Icons.X className="w-6 h-6" /></button>
                    <div className="max-w-lg space-y-8 animate-in slide-in-from-bottom-8 duration-700 delay-100">
                        <div className="flex justify-center mb-6"><div className={`p-4 rounded-full ${theme.iconBg}`}><Icons.Heart className={`w-16 h-16 ${theme.iconColor}`} /></div></div>
                        <h2 className={`text-4xl font-serif mb-4 tracking-wide ${theme.title}`}>{data.title}</h2>
                        <div className={`space-y-6 font-light text-lg leading-relaxed ${theme.text}`}>
                            {data.messageLines.map((line, i) => (<p key={i} className={i === 0 ? `text-2xl font-serif italic ${theme.title}` : ""}>{line}</p>))}
                        </div>
                        <div className="pt-12"><p className={`${theme.signoff} text-xs font-mono uppercase tracking-[0.3em]`}>{data.messageSignoff}</p></div>
                    </div>
                </div>
            );
        };

        const ChecklistModal = ({ data, onClose }) => {
            const theme = MODAL_THEMES[data.theme] || MODAL_THEMES.neutral;
            const [items, setItems] = useState(data.items.map((item, idx) => ({ id: idx, text: item, checked: false })));
            const toggleItem = (id) => setItems(items.map(item => item.id === id ? { ...item, checked: !item.checked } : item));
            const progress = Math.round((items.filter(i => i.checked).length / items.length) * 100);
            
            return (
                <div className={`fixed inset-0 ${theme.bg} z-[100] overflow-y-auto animate-in fade-in duration-300`}>
                    <div className="max-w-2xl mx-auto p-6 pt-12">
                        <div className="flex justify-between items-start mb-6">
                            <div><h2 className={`text-4xl font-serif mb-2 ${theme.title}`}>{data.title}</h2><p className={`${theme.signoff} font-mono text-sm tracking-widest uppercase`}>Protocol</p></div>
                            <button onClick={onClose} className={`absolute top-6 right-6 p-2 rounded-full transition-colors ${theme.btn}`}><Icons.X className="w-6 h-6" /></button>
                        </div>
                        <div className={`sticky top-0 z-30 ${theme.bg} pb-6 pt-2 mb-2 border-b ${theme.border}`}>
                            <div className={`flex justify-between text-xs font-mono mb-2 uppercase tracking-wider ${theme.signoff}`}>
                                <span>{progress === 100 ? "Ready!" : "Readiness"}</span>
                                <span>{progress}%</span>
                            </div>
                            <div className={`h-1 ${theme.progressBg} rounded-full overflow-hidden`}><div className={`h-full ${theme.progressFill} transition-all duration-500 ease-out`} style={{ width: `${progress}%` }}></div></div>
                        </div>
                        <div className="space-y-3 py-4">
                            {items.map(item => (
                                <label key={item.id} className={`group flex items-center p-4 border rounded-xl cursor-pointer transition-all ${theme.checkBg} ${theme.border} hover:shadow-sm`}>
                                    <input type="checkbox" className="hidden custom-checkbox" checked={item.checked} onChange={() => toggleItem(item.id)} />
                                    <div className={`w-6 h-6 border-2 rounded-md flex items-center justify-center mr-4 transition-colors ${theme.checkBorder} ${item.checked ? theme.checkFill : ''}`}>
                                        <Icons.Check className={`w-4 h-4 ${theme.bg} ${item.checked ? 'block' : 'hidden'}`} />
                                    </div>
                                    <span className={`text-lg font-light tracking-wide transition-opacity ${item.checked ? theme.checkedText : theme.text}`}>{item.text}</span>
                                </label>
                            ))}
                        </div>
                        {data.footer && <div className="mt-12 text-center pb-8"><p className={`${theme.signoff} text-xs font-mono uppercase tracking-[0.2em]`}>{data.footer}</p></div>}
                    </div>
                </div>
            );
        };

        // --- MAIN APP ---
        const WeddingTimeline = () => {
            const [expandedEvent, setExpandedEvent] = useState(null);
            const [selectedFilters, setSelectedFilters] = useState(['all']);
            const [searchQuery, setSearchQuery] = useState('');
            const [expandAll, setExpandAll] = useState(false);
            const [currentTime, setCurrentTime] = useState(new Date());
            const [countdown, setCountdown] = useState({ days: 0, hours: 0, minutes: 0, seconds: 0 });
            
            const [showFilters, setShowFilters] = useState(false);
            const [showLinks, setShowLinks] = useState(false);
            const [activeChecklist, setActiveChecklist] = useState(null); 
            const [filterClicks, setFilterClicks] = useState({}); 
            
            const [view, setView] = useState('timeline'); 
            const [mapZoom, setMapZoom] = useState(false);
            const [isScrolled, setIsScrolled] = useState(false);

            const activeRef = useRef(null); 
            const weddingDate = new Date(CONFIG.weddingDate);

            useEffect(() => { const timer = setInterval(() => setCurrentTime(new Date()), 60000); return () => clearInterval(timer); }, []);
            
            useEffect(() => {
                const handleScroll = () => setIsScrolled(window.scrollY > 100);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            // Countdown Timer
            useEffect(() => {
                const updateCountdown = () => {
                    const now = new Date();
                    const difference = weddingDate.getTime() - now.getTime();
                    if (difference > 0) {
                        setCountdown({
                            days: Math.floor(difference / (1000 * 60 * 60 * 24)),
                            hours: Math.floor((difference / (1000 * 60 * 60)) % 24),
                            minutes: Math.floor((difference / 1000 / 60) % 60),
                            seconds: Math.floor((difference / 1000) % 60)
                        });
                    } else { setCountdown({ days: 0, hours: 0, minutes: 0, seconds: 0 }); }
                };
                updateCountdown();
                const timer = setInterval(updateCountdown, 1000);
                return () => clearInterval(timer);
            }, []);

            // Gesture Swiping Logic (RESTRICTED TO STICKY HEADERS)
            const [touchStart, setTouchStart] = useState(null);
            const [touchEnd, setTouchEnd] = useState(null);
            const minSwipeDistance = 50;
            
            const onTouchStart = (e) => { setTouchEnd(null); setTouchStart(e.targetTouches[0].clientX); };
            const onTouchMove = (e) => { setTouchEnd(e.targetTouches[0].clientX); };
            const onTouchEnd = () => {
                if (!touchStart || !touchEnd) return;
                const distance = touchStart - touchEnd;
                if (distance > minSwipeDistance) {
                    if (view === 'timeline') setView('vendors');
                    if (view === 'map') setView('timeline');
                }
                if (distance < -minSwipeDistance) {
                    if (view === 'timeline' && CONFIG.enableMapScreen) setView('map');
                    if (view === 'vendors') setView('timeline');
                }
            };

            const parseEventTime = (timeStr) => {
                const [time, period] = timeStr.split(' ');
                let [hours, minutes] = time.split(':').map(Number);
                if (period === 'PM' && hours !== 12) hours += 12;
                if (period === 'AM' && hours === 12) hours = 0;
                return hours * 60 + minutes; 
            };

            const isWeddingDay = currentTime.toDateString() === weddingDate.toDateString(); 
            const currentMinutes = currentTime.getHours() * 60 + currentTime.getMinutes();

            // RENDER LOGIC
            const renderDescriptionContent = (desc) => {
                if (!desc) return null;
                if (typeof desc === 'string') return <p className="text-stone-700 mt-4 leading-relaxed">{desc}</p>;
                if (Array.isArray(desc)) {
                    if (typeof desc[0] === 'string') {
                        return <ul className="text-stone-700 mt-4 leading-relaxed list-none space-y-2">{desc.map((line, idx) => <li key={idx} className="flex items-start gap-2"><span className="text-stone-400 mt-1.5 w-1.5 h-1.5 rounded-full bg-stone-300 shrink-0"></span><span>{line}</span></li>)}</ul>;
                    }
                    if (typeof desc[0] === 'object') {
                        return (
                            <div className="mt-4 space-y-4">
                                {desc.map((section, idx) => {
                                    if (section.type === 'paragraph' || section.type === 'text') return <p key={idx} className="text-stone-700 leading-relaxed">{section.text}</p>;
                                    if (section.type === 'list') return <ul key={idx} className="text-stone-700 leading-relaxed list-none space-y-2 pl-1">{section.items.map((line, i) => <li key={i} className="flex items-start gap-2"><span className="text-stone-400 mt-1.5 w-1.5 h-1.5 rounded-full bg-stone-300 shrink-0"></span><span>{line}</span></li>)}</ul>;
                                    if (section.type === 'checklist') return <div key={idx} className={`space-y-2 bg-stone-50 p-3 rounded-lg border border-stone-200`}>{section.items.map((item, i) => <label key={i} className="flex items-center gap-3 cursor-pointer group"><div className="relative flex items-center"><input type="checkbox" className="peer appearance-none w-5 h-5 border-2 border-stone-300 rounded bg-white checked:bg-black checked:border-black transition-colors" /><Icons.Check className="w-3.5 h-3.5 text-white absolute left-[3px] top-[3px] opacity-0 peer-checked:opacity-100 pointer-events-none" /></div><span className="text-sm text-stone-600 group-hover:text-black transition-colors select-none">{item}</span></label>)}</div>;
                                    return null;
                                })}
                            </div>
                        );
                    }
                }
                return null;
            };

            const filteredEvents = events.filter(event => {
                const teamMatch = selectedFilters.includes('all') || event.teams.includes('all') || event.teams.some(team => selectedFilters.includes(team));
                const searchTextMatches = (text) => text.toLowerCase().includes(searchQuery.toLowerCase());
                
                let descMatch = false;
                if (typeof event.description === 'string') descMatch = searchTextMatches(event.description);
                else if (Array.isArray(event.description)) {
                    descMatch = event.description.some(item => typeof item === 'string' ? searchTextMatches(item) : (item.text && searchTextMatches(item.text)) || (item.items && item.items.some(i => searchTextMatches(i))));
                }

                const searchMatch = searchQuery === '' || searchTextMatches(event.title) || descMatch || searchTextMatches(event.location) || searchTextMatches(event.time) || (event.responsible && event.responsible.some(r => searchTextMatches(r)));
                return teamMatch && searchMatch;
            });

            const firstActiveIndex = filteredEvents.findIndex(event => !(isWeddingDay && parseEventTime(event.time) < currentMinutes - 30));

            const toggleFilter = (filterId) => {
                // Easter Egg Triple-Tap Logic
                if (CONFIG.checklists[filterId]) {
                    if (!selectedFilters.includes(filterId)) {
                        setSelectedFilters([filterId]); // Tap 1: Select
                        setFilterClicks({ [filterId]: 1 });
                    } else {
                        const newCount = (filterClicks[filterId] || 1) + 1;
                        if (newCount >= 3) { // Tap 3: Open
                            setActiveChecklist(filterId);
                            setFilterClicks({ [filterId]: 1 }); // reset
                        } else {
                            setFilterClicks({ [filterId]: newCount }); // Tap 2: Lock (stays selected)
                        }
                    }
                    return; 
                }

                // Standard Toggle Logic
                setFilterClicks({});
                if (filterId === 'all') { setSelectedFilters(['all']); } 
                else {
                    setSelectedFilters(prev => {
                        const cleanPrev = prev.filter(f => f !== 'all');
                        if (prev.includes(filterId)) { 
                            const newFilters = cleanPrev.filter(f => f !== filterId); 
                            return newFilters.length === 0 ? ['all'] : newFilters; 
                        } else { 
                            return [...cleanPrev, filterId]; 
                        }
                    });
                }
            };

            const toggleExpandAll = () => { setExpandAll(!expandAll); if (!expandAll) setExpandedEvent(null); };

            const layoutWidth = CONFIG.enableMapScreen ? 'w-[300%]' : 'w-[200%]';
            const translation = CONFIG.enableMapScreen 
                ? (view === 'map' ? '0' : view === 'timeline' ? '33.333' : '66.666')
                : (view === 'timeline' ? '0' : '50');
            const panelWidth = CONFIG.enableMapScreen ? 'w-1/3' : 'w-1/2';

            return (
                <div className={`overflow-x-hidden w-full relative min-h-screen bg-stone-50`}>
                    
                    {/* DYNAMIC MODALS (Easter Eggs & Info) */}
                    {activeChecklist && (
                        (activeChecklist === 'bride' && isWeddingDay) || CONFIG.checklists[activeChecklist].type === 'message'
                            ? <MessageModal data={CONFIG.checklists[activeChecklist]} onClose={() => setActiveChecklist(null)} />
                            : <ChecklistModal data={CONFIG.checklists[activeChecklist]} onClose={() => setActiveChecklist(null)} />
                    )}
                    {showLinks && <HelpfulLinksModal onClose={() => setShowLinks(false)} />}

                    {/* --- DESKTOP NAVIGATION ARROWS --- */}
                    <div className="hidden md:block fixed top-1/2 left-8 z-50 transform -translate-y-1/2">
                        {view === 'timeline' && CONFIG.enableMapScreen && <button onClick={() => setView('map')} className="bg-white/80 backdrop-blur shadow-lg p-4 rounded-full hover:bg-white transition-all hover:scale-110 border border-stone-100"><Icons.ArrowLeft className="w-6 h-6 text-stone-600" /></button>}
                        {view === 'vendors' && <button onClick={() => setView('timeline')} className="bg-white/80 backdrop-blur shadow-lg p-4 rounded-full hover:bg-white transition-all hover:scale-110 border border-stone-100"><Icons.ArrowLeft className="w-6 h-6 text-stone-600" /></button>}
                    </div>
                    <div className="hidden md:block fixed top-1/2 right-8 z-50 transform -translate-y-1/2">
                        {view === 'timeline' && <button onClick={() => setView('vendors')} className="bg-white/80 backdrop-blur shadow-lg p-4 rounded-full hover:bg-white transition-all hover:scale-110 border border-stone-100"><Icons.ArrowRight className="w-6 h-6 text-stone-600" /></button>}
                        {view === 'map' && <button onClick={() => setView('timeline')} className="bg-white/80 backdrop-blur shadow-lg p-4 rounded-full hover:bg-white transition-all hover:scale-110 border border-stone-100"><Icons.ArrowRight className="w-6 h-6 text-stone-600" /></button>}
                    </div>

                    {/* --- SLIDING CONTAINER --- */}
                    <div className={`flex ${layoutWidth} transition-transform duration-500 ease-in-out`} style={{ transform: `translateX(-${translation}%)` }}>
                        
                        {/* --- VIEW 1: MAP (ONLY RENDER IF ENABLED) --- */}
                        {CONFIG.enableMapScreen && (
                            <div className={`${panelWidth} shrink-0 h-screen relative bg-stone-200 flex flex-col`}>
                                <div className="absolute top-6 left-6 z-10"><button onClick={() => setView('timeline')} className="bg-white/90 p-3 rounded-full shadow-md"><Icons.ArrowRight className="w-6 h-6 text-stone-600" /></button></div>
                                <div onClick={() => setMapZoom(!mapZoom)} className={`flex-1 relative overflow-hidden flex items-center justify-center cursor-zoom-in ${mapZoom ? 'cursor-grab active:cursor-grabbing' : ''}`}>
                                    <div className={`transition-all duration-300 w-full h-full ${mapZoom ? 'overflow-auto no-scrollbar' : 'overflow-hidden flex items-center justify-center'}`}>
                                        <img src={CONFIG.mapImageURL} alt="Map" className={`transition-transform duration-300 origin-center ${mapZoom ? 'w-[250%] max-w-none' : 'w-full h-full object-contain p-4'}`} />
                                    </div>
                                </div>
                                <div className={`absolute bottom-8 left-1/2 transform -translate-x-1/2 bg-black/70 text-white px-4 py-2 rounded-full text-xs font-medium transition-opacity duration-300 ${mapZoom ? 'opacity-0' : 'opacity-100'}`}>Tap map to zoom</div>
                            </div>
                        )}

                        {/* --- VIEW 2: TIMELINE (CENTER) --- */}
                        <div className={`${panelWidth} shrink-0 relative z-20 min-h-screen bg-stone-50`}>
                            
                            {/* SMART STICKY HEADER (Names + Filter Bar) */}
                            <div 
                                className="sticky top-0 z-50 w-full shadow-sm flex flex-col" 
                                onTouchStart={onTouchStart} onTouchMove={onTouchMove} onTouchEnd={onTouchEnd}
                            >
                                {/* Header Info */}
                                <header className={`bg-white/95 backdrop-blur overflow-hidden transition-all duration-300 ${isScrolled ? 'max-h-0 opacity-0' : 'max-h-64 opacity-100 border-b border-stone-200'}`}>
                                    <div className="w-full flex justify-center pt-3 md:hidden"><div className="w-12 h-1.5 bg-stone-200 rounded-full"></div></div>
                                    <div className="max-w-4xl mx-auto px-4 py-6 pb-6 pt-4 text-center select-none">
                                        <h1 className="text-4xl font-serif text-black mb-2">{CONFIG.coupleNames}</h1>
                                        <p className="text-stone-600 font-light tracking-wide">{CONFIG.displayDate}</p>
                                        <p className="text-stone-400 font-light text-sm mt-1">{CONFIG.weddingLocation}</p>
                                        
                                        {countdown.days > 0 || countdown.hours > 0 || countdown.minutes > 0 ? (
                                            <div className="mt-4 flex items-center justify-center gap-4">
                                                <Icons.Clock className="w-4 h-4 text-stone-400" />
                                                <div className="flex gap-3 text-sm">
                                                    {countdown.days > 0 && <div className="flex flex-col items-center"><span className="text-2xl font-serif text-black">{countdown.days}</span><span className="text-xs text-stone-500 uppercase tracking-wide">Days</span></div>}
                                                    <div className="flex flex-col items-center"><span className="text-2xl font-serif text-black">{countdown.hours}</span><span className="text-xs text-stone-500 uppercase tracking-wide">Hours</span></div>
                                                    <div className="flex flex-col items-center"><span className="text-2xl font-serif text-black">{countdown.minutes}</span><span className="text-xs text-stone-500 uppercase tracking-wide">Minutes</span></div>
                                                    <div className="flex flex-col items-center"><span className="text-2xl font-serif text-black">{countdown.seconds}</span><span className="text-xs text-stone-500 uppercase tracking-wide">Seconds</span></div>
                                                </div>
                                            </div>
                                        ) : isWeddingDay ? (
                                            <div className="mt-4"><p className="text-lg font-serif text-black">Today's the day! 🎉</p></div>
                                        ) : (
                                            <div className="mt-4"><p className="text-sm text-stone-500">The big day has arrived!</p></div>
                                        )}
                                    </div>
                                </header>

                                {/* Filter Bar (Always visible) */}
                                <div className={`bg-white/95 backdrop-blur w-full transition-all duration-300 ${isScrolled ? 'border-b border-stone-200 shadow-sm' : ''}`}>
                                    <div className="max-w-4xl mx-auto px-4">
                                        <div className="flex items-center justify-between w-full">
                                            {/* Scroll to Top Button (appears when scrolled) */}
                                            {isScrolled && (
                                                <button onClick={() => window.scrollTo({top:0, behavior:'smooth'})} className="py-4 pr-4 pl-2 text-stone-400 hover:text-black transition-colors md:hidden">
                                                    <Icons.ArrowUp className="w-5 h-5" />
                                                </button>
                                            )}

                                            <button onClick={() => { if(isScrolled) window.scrollTo({top:0, behavior:'smooth'}); setShowFilters(!showFilters); }} className="py-4 flex-1 flex items-center justify-between text-stone-600 hover:text-black transition-colors">
                                                <div className="flex items-center gap-2"><Icons.Search className="w-4 h-4" /><span className="font-serif text-sm uppercase tracking-wider">Search & Filters</span></div>
                                                {showFilters ? <Icons.ChevronUp className="w-5 h-5" /> : <Icons.ChevronDown className="w-5 h-5" />}
                                            </button>
                                            
                                            <div className="w-px h-6 bg-stone-200 mx-4"></div>
                                            <button onClick={() => setShowLinks(true)} className="py-4 flex items-center gap-2 text-stone-600 hover:text-black">
                                                <Icons.Info className="w-5 h-5" />
                                                <span className="hidden sm:inline font-serif text-sm uppercase tracking-wider">Info</span>
                                            </button>
                                        </div>

                                        {showFilters && (
                                            <div className="pb-4 animate-in slide-in-from-top-2 duration-200">
                                                <div className="mb-4">
                                                    <input type="text" placeholder="Search events, locations, or times..." value={searchQuery} onChange={e => setSearchQuery(e.target.value)} className="w-full px-4 py-2 rounded-lg border border-stone-300 focus:outline-none focus:border-black transition-colors"/>
                                                </div>
                                                <div className="flex flex-wrap gap-2 justify-center items-center">
                                                    {CONFIG.filters.map(filter => {
                                                        const isSelected = selectedFilters.includes(filter.id);
                                                        const btnClass = isSelected ? 'bg-black text-white shadow-md' : `bg-stone-100 text-stone-700 hover:bg-stone-200`;
                                                        return (
                                                            <button key={filter.id} onClick={() => toggleFilter(filter.id)} className={`px-4 py-2 rounded-full text-sm font-light tracking-wide transition-all duration-200 ${btnClass}`}>{filter.label}</button>
                                                        );
                                                    })}
                                                    <div className="w-px h-6 bg-stone-300 mx-2"></div>
                                                    <button onClick={toggleExpandAll} className="px-4 py-2 rounded-full text-sm font-light tracking-wide transition-all bg-stone-800 text-white hover:bg-black shadow-md">{expandAll ? 'Collapse All' : 'Expand All'}</button>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>

                            {/* Timeline List */}
                            <div className="max-w-3xl mx-auto px-4 py-8 pb-32">
                                <div className="relative">
                                    <div className="absolute left-12 top-0 bottom-0 w-px bg-stone-300 transform -translate-x-1/2"></div>
                                    <div className="space-y-4">
                                        {filteredEvents.map((event, index) => {
                                            const isExpanded = expandedEvent === event.id || expandAll;
                                            const isPast = isWeddingDay && parseEventTime(event.time) < currentMinutes - 30;
                                            const isFirstActive = index === firstActiveIndex;

                                            return (
                                                <div key={event.id} ref={isFirstActive ? activeRef : null} className={`relative transition-all duration-500 ease-in-out ${isExpanded ? 'flex flex-col items-center gap-4 py-4 z-20' : 'pl-32'} ${isPast ? 'opacity-60 grayscale' : ''}`}>
                                                    <div className={`transition-all duration-500 ease-in-out z-10 ${isExpanded ? 'relative w-auto transform translate-x-0' : 'absolute left-0 w-24 flex justify-center mt-1'}`}>
                                                        <div className={`px-3 py-1.5 rounded-lg shadow-sm relative transition-colors duration-500 ${isPast ? 'bg-stone-200 text-stone-500' : 'bg-black text-white'}`}>
                                                            <span className="text-sm font-medium tracking-wide">{event.time}</span>
                                                        </div>
                                                    </div>
                                                    <div className={`bg-white rounded-xl border border-stone-200 overflow-hidden transition-all duration-500 ease-in-out ${isExpanded ? 'w-[100%] sm:w-[95%] shadow-xl relative z-20' : 'w-full shadow-sm hover:shadow-md'}`}>
                                                        <button onClick={() => toggleEvent(event.id)} className="w-full px-6 py-5 text-left flex items-center justify-between bg-white">
                                                            <div className="flex-1">
                                                                <h3 className="text-xl font-serif text-black mb-2">{event.title}</h3>
                                                                <div className="flex flex-col gap-2">
                                                                    <a href={`http://googleusercontent.com/maps.google.com/?q=${encodeURIComponent(event.location)}`} target="_blank" rel="noopener noreferrer" className={`inline-flex items-center gap-1.5 text-sm text-stone-500 font-light hover:text-black transition-colors w-fit`}>
                                                                        <Icons.MapPin className="w-3.5 h-3.5" />
                                                                        <span className="underline underline-offset-2">{event.location}</span>
                                                                    </a>
                                                                    {event.responsible && (
                                                                        <div className="flex items-center gap-1.5 text-xs text-stone-400 font-medium uppercase tracking-wide">
                                                                            <Icons.User className="w-3.5 h-3.5" />
                                                                            {event.responsible.join(', ')}
                                                                        </div>
                                                                    )}
                                                                </div>
                                                            </div>
                                                            {isExpanded ? <Icons.ChevronUp className="w-5 h-5 text-stone-400" /> : <Icons.ChevronDown className="w-5 h-5 text-stone-400" />}
                                                        </button>
                                                        <div className={`transition-all duration-500 ease-in-out overflow-hidden ${isExpanded ? 'max-h-[3000px] opacity-100' : 'max-h-0 opacity-0'}`}>
                                                            <div className="px-6 pb-6 border-t border-stone-100">
                                                                {renderDescriptionContent(event.description)}
                                                                <div className="mt-5 flex flex-wrap gap-2">{event.teams.map(team => (<span key={team} className={`px-3 py-1 bg-stone-100 text-stone-600 text-xs rounded-full border border-stone-200`}>{CONFIG.filters.find(f => f.id === team)?.label || team}</span>))}</div>
                                                                {event.image && <img src={event.image} alt={event.title} className="mt-4 rounded-xl w-full border border-stone-100" />}
                                                                {event.links && event.links.length > 0 && (
                                                                    <div className="mt-4 space-y-2">
                                                                        {event.links.map((link, idx) => (
                                                                            <a key={idx} href={link.url} target="_blank" rel="noopener noreferrer" className={`inline-flex items-center gap-2 text-black text-sm underline-offset-4 hover:underline transition-colors`}><Icons.ExternalLink className="w-4 h-4" />{link.text}</a>
                                                                        ))}
                                                                    </div>
                                                                )}
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>

                            <footer className="mt-8 border-t border-stone-200">
                                <div className="max-w-4xl mx-auto px-4 py-12 text-center">
                                    <Icons.Heart className={`w-6 h-6 mx-auto mb-4 text-stone-300`} fillClass="fill-stone-100" />
                                    <p className="text-stone-600 font-light text-sm">{CONFIG.footerMessage}</p>
                                    <p className="text-stone-400 font-serif italic text-sm mt-4">{CONFIG.footerSignoff}</p>
                                </div>
                            </footer>
                        </div>

                        {/* --- VIEW 3: VENDOR LIST (RIGHT) --- */}
                        <div className={`${panelWidth} shrink-0 min-h-screen relative bg-stone-50`}>
                            
                            {/* Vendor Swipe Header */}
                            <div 
                                className={`bg-white/95 backdrop-blur border-b border-stone-200 sticky top-0 z-50`}
                                onTouchStart={onTouchStart} onTouchMove={onTouchMove} onTouchEnd={onTouchEnd}
                            >
                                <div className="w-full flex justify-center pt-3 md:hidden"><div className="w-12 h-1.5 bg-stone-200 rounded-full"></div></div>
                                <div className="max-w-3xl mx-auto px-6 py-6 pt-4 text-center select-none relative">
                                    <button onClick={() => setView('timeline')} className="absolute left-6 top-5 p-2 text-stone-400 hover:text-black md:hidden">
                                        <Icons.ArrowLeft className="w-6 h-6" />
                                    </button>
                                    <h2 className="text-3xl font-serif text-black mb-1">Vendor Directory</h2>
                                    <p className="text-stone-500 text-sm font-light">Key contacts for the big day.</p>
                                </div>
                            </div>

                            <div className="max-w-3xl mx-auto px-4 py-8">
                                <div className="bg-white rounded-2xl shadow-sm border border-stone-200 overflow-hidden">
                                    <div className="divide-y divide-stone-100">
                                        {vendors.map((vendor, idx) => (
                                            <div key={idx} className="p-6 flex flex-col sm:flex-row gap-4 sm:items-center justify-between hover:bg-stone-50 transition-colors">
                                                <div>
                                                    <p className="text-xs font-bold uppercase tracking-widest text-stone-400 mb-1">{vendor.role}</p>
                                                    <h3 className="text-lg font-serif text-black">{vendor.name}</h3>
                                                </div>
                                                <div className="flex gap-2">
                                                    {vendor.email && (
                                                        <a href={`mailto:${vendor.email}`} className={`flex items-center justify-center gap-2 border border-stone-200 text-stone-600 w-10 h-10 rounded-full hover:bg-stone-100 transition-colors`}>
                                                            <Icons.Mail className="w-4 h-4" />
                                                        </a>
                                                    )}
                                                    {vendor.contact && vendor.contact !== 'TBA' ? (
                                                        <a href={`tel:${vendor.contact}`} className={`flex items-center gap-2 bg-black text-white px-4 py-2 h-10 rounded-full text-sm font-medium transition-opacity hover:opacity-80`}>
                                                            <Icons.Phone className="w-4 h-4" /><span>Call</span>
                                                        </a>
                                                    ) : (
                                                        <span className="text-xs text-stone-400 font-mono bg-stone-100 px-3 py-2 h-10 rounded-full flex items-center">TBA</span>
                                                    )}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                                <div className="mt-12 text-center pb-12"><button onClick={() => setView('timeline')} className="text-stone-500 hover:text-black text-sm flex items-center justify-center gap-2 mx-auto transition-colors"><Icons.ArrowLeft className="w-4 h-4" />Back to Timeline</button></div>
                            </div>
                        </div>

                    </div>
                </div>
            );
        };

        // --- AUTH WRAPPER ---
        const App = () => {
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [isTransitioning, setIsTransitioning] = useState(false);

            useEffect(() => {
                if (localStorage.getItem('weddingAuth_' + CONFIG.pinCode) === 'true') {
                    setIsAuthenticated(true);
                }
            }, []);

            if (!isAuthenticated && !isTransitioning) {
                return <PinScreen onAccess={() => setIsTransitioning(true)} />;
            }

            if (isTransitioning) {
                setTimeout(() => setIsAuthenticated(true), 10);
            }

            return (
                <div className="animate-in fade-in zoom-in-95 duration-1000 ease-out">
                    <WeddingTimeline />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
